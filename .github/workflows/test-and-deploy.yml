name: Deploy Report
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Allure History
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-data
        continue-on-error: true
      - name: Restore Allure History
        if: hashFiles('gh-pages-data/allure-history/**') != ''
        run: |
          mkdir -p allure-history
          cp -r gh-pages-data/allure-history/* allure-history/ 2>/dev/null || true
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          allure_report: allure-report
          allure_history: allure-history
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate HTML Report
        if: always()
        run: node generate_report.js
      - name: Prepare public
        if: always()
        run: |
          mkdir -p public/allure
          cp -r allure-report/* public/allure/ 2>/dev/null || true
          ls -la public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
