name: Test & Deploy Report
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g allure-commandline
      - name: Run Maven Tests
        continue-on-error: true
        run: mvn clean test -Dheadless=true -Dallure.results.directory=target/allure-results -Dsurefire.useSystemClassLoader=false
      - name: Check Allure Results
        if: always()
        run: |
          ls -la target/allure-results/ 2>/dev/null | head -20 || echo "NO allure-results"
          ls -la target/surefire-reports/ 2>/dev/null | head -10 || echo "NO surefire-reports"
      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p public
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results 2>/dev/null)" ]; then
            echo "Generating Allure report..."
            allure generate target/allure-results --clean -o public
          else
            echo "allure-results empty, creating fallback"
            cat > public/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>Selenium Test Report</title>
            <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{font-family:Inter,sans-serif;background:#f1f5f9;color:#1e293b}
              .header{background:linear-gradient(135deg,#0f172a,#1e3a5f);color:white;padding:2rem;text-align:center}
              .header h1{font-size:1.5rem}.header p{color:#60a5fa}
              .container{max-width:800px;margin:2rem auto;padding:0 1rem}
              .card{background:white;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.08)}
              .card h2{font-size:1rem;margin-bottom:.75rem;color:#0f172a;display:flex;align-items:center;gap:.5rem}
              .card h2 i{color:#3b82f6}
              .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
              .tag{background:#eff6ff;color:#3b82f6;padding:.25rem .6rem;border-radius:6px;font-size:.75rem;font-weight:600}
              .features{list-style:none}.features li{padding:.4rem 0;font-size:.85rem;color:#475569;display:flex;align-items:center;gap:.5rem}
              .features li i{color:#10b981;font-size:.7rem}
              .btn{display:inline-flex;align-items:center;gap:.5rem;background:#0f172a;color:white;padding:.6rem 1.2rem;border-radius:8px;text-decoration:none;font-weight:600;font-size:.85rem;margin-top:.5rem}
              .footer{text-align:center;padding:1.5rem;font-size:.75rem;color:#94a3b8}
            </style>
          </head>
          <body>
            <div class="header">
              <h1><i class="fas fa-check-double"></i> Selenium Automation</h1>
              <p>Test Execution Report</p>
            </div>
            <div class="container">
              <div class="card">
                <h2><i class="fas fa-info-circle"></i> Project Overview</h2>
                <p style="font-size:.85rem;color:#475569;margin-bottom:1rem">Automated web testing with Selenium 4, TestNG, Page Object Model, and Allure Reports against practicesoftwaretesting.com</p>
                <div class="tags"><span class="tag">Java</span><span class="tag">Selenium 4</span><span class="tag">TestNG</span><span class="tag">POM</span><span class="tag">Allure</span></div>
              </div>
              <div class="card">
                <h2><i class="fas fa-check-circle"></i> Key Features</h2>
                <ul class="features">
                  <li><i class="fas fa-check"></i> Page Object Model design pattern</li>
                  <li><i class="fas fa-check"></i> Explicit waits and element interactions</li>
                  <li><i class="fas fa-check"></i> Cross-browser testing (Chrome/Firefox)</li>
                  <li><i class="fas fa-check"></i> Headless mode for CI environments</li>
                  <li><i class="fas fa-check"></i> Allure report integration</li>
                </ul>
              </div>
              <a href="https://github.com/kestupinanmicolta/selenium-web-automation" class="btn"><i class="fab fa-github"></i> View Source Code</a>
            </div>
            <div class="footer">2026 Karen Paola Estupinan Micolta</div>
          </body>
          </html>
          HTMLEOF
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
